name: CI

# Correctness gates that run on every pull request and every push to main.
#
# Deliberately separate from shipping: the app is deployed by Vercel's Git
# integration, which builds every push to main. This one also runs on pull
# requests, which is where a rules regression should be caught — before it is
# merged and auto-deployed.
#
# Every job here runs against simulations. Nothing in CI touches the live
# Firebase project: Firestore and Auth are emulated (see scripts/e2e.sh and
# playwright.config.ts), and the `e2e` job refuses to start if anyone has set
# E2E_LIVE_FIRESTORE. A live run writes the organisation's real data and, on
# 2026-08-03, exhausted the project's daily quota for the rest of the day.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer commit on the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm run build` is `tsc -b && vite build` — type checking is the
      # correctness gate for this project, not lint (ESLint is unconfigured).
      - name: Build
        run: npm run build

  rules:
    name: Firestore security rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # The Firestore emulator is a Java process; without a JDK on the runner
      # `emulators:exec` fails before a single test runs.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # The HR Manager privilege boundary lives entirely in firestore.rules —
      # nothing in the app or the E2E suite exercises it, so this is the only
      # thing standing between a rules edit and a live privilege-escalation
      # path. See tests/rules/.
      - name: Run security-rules tests
        run: npm run test:rules

  e2e:
    name: E2E (emulated)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # A live run would write the organisation's real configuration. CI must
      # never be the thing that does that, however the variable got set.
      - name: Refuse to run against the live project
        run: |
          if [ -n "${E2E_LIVE_FIRESTORE:-}" ]; then
            echo "E2E_LIVE_FIRESTORE is set in CI. Refusing: CI runs simulations only." >&2
            exit 1
          fi
          echo "no live-project override present — proceeding with emulators"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # Both emulators the suite needs (Firestore and Auth) are Java processes.
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      # Chromium only. The role and org-settings specs assert app logic and
      # server behaviour, which is identical across engines; running three
      # triples the runtime for no extra signal.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # scripts/e2e.sh starts firestore+auth for the run and shuts them down
      # after. playwright.config.ts points the bundle and the specs' REST
      # helpers at them, so no credential and no network access is required.
      - name: Run E2E against the emulators
        run: E2E_BROWSERS=chromium npm run test:e2e -- --project=app --project=org-settings
        env:
          E2E_ORG_SETTINGS_DEPLOYED: 'true'

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
