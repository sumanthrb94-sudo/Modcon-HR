<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Modcon HR">
  <!-- The Modcon HR mark: an enclosed monogram, the letter M cut into three
       modules and knocked out of a solid tile. Two full columns carry the
       structure, the short accent column is the person moving through it.
       No rounded tile and no padding — the OS applies its own mask. -->
  <rect width="24" height="24" fill="#201e1d"/>
  <rect x="4.5" y="5" width="4" height="14" fill="#ffffff"/>
  <rect x="10" y="5" width="4" height="7.5" fill="#ec3013"/>
  <rect x="15.5" y="5" width="4" height="14" fill="#ffffff"/>
</svg>
